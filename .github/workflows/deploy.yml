name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # some tests check the generated PDFs with poppler and qpdf
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf imagemagick
      - name: Studios (built by studios.yml, kept on the studios branch)
        run: |
          mkdir -p public/studio
          if git ls-remote --exit-code --heads origin studios >/dev/null 2>&1; then
            git clone --depth 1 --branch studios "https://github.com/${{ github.repository }}.git" /tmp/studios
            rm -rf /tmp/studios/.git /tmp/studios/_shots
            cp -r /tmp/studios/. public/studio/
            du -sh public/studio
          fi
      - run: npm test
      # The site's own address (set the repository variable CUSTOM_DOMAIN, e.g. shootcut.com, to use a custom domain)
      - name: Build
        env:
          SITE_URL: ${{ vars.CUSTOM_DOMAIN != '' && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: npm run build
      - name: Custom domain file
        if: ${{ vars.CUSTOM_DOMAIN != '' }}
        run: echo "${{ vars.CUSTOM_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
